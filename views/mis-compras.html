<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineCentral - Mis Entradas</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #141414; color: white; font-family: 'Poppins', sans-serif; padding: 20px; margin: 0; }
        .container { max-width: 800px; margin: 30px auto; }
        .nav-volver { color: #aaa; text-decoration: none; font-size: 0.9rem; display: inline-block; margin-bottom: 20px; }
        .nav-volver:hover { color: white; }
        h1 { color: #e50914; margin-bottom: 25px; }
        
        .grid-tickets {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }
        .ticket-card {
            background: #1c1c1c;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .ticket-card h3 { margin-top: 0; color: #fff; }
        .ticket-info { text-align: left; font-size: 0.85rem; color: #aaa; margin: 15px 0; border-top: 1px dashed #333; border-bottom: 1px dashed #333; padding: 10px 0; }
        .ticket-info p { margin: 5px 0; }
        .ticket-info strong { color: #fff; }
        .qr-img { width: 180px; height: 180px; background: white; padding: 8px; border-radius: 8px; margin: 10px auto; display: block; }
        .no-tickets { background: #1c1c1c; padding: 30px; border-radius: 10px; text-align: center; color: #888; border: 1px solid #333; }
    </style>
</head>
<body>
    <div class="container">
        <a href="/cartelera" class="nav-volver">← Volver a Cartelera</a>
        <h1>Mis Entradas y QR Guardados 🎟️</h1>

        <div id="contenedor-tickets" class="grid-tickets">
            <!-- Se cargan dinámicamente -->
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const contenedor = document.getElementById('contenedor-tickets');

            try {
                // Petición al backend para traer las compras del usuario logueado
                const res = await fetch('/api/usuario/compras');
                if (!res.ok) throw new Error('No se pudieron cargar las entradas');

                const tickets = await res.json();

                contenedor.innerHTML = '';

                if (tickets.length === 0) {
                    contenedor.innerHTML = '<div class="no-tickets" style="grid-column: 1 / -1;">No tienes entradas compradas todavía.</div>';
                    return;
                }

                tickets.forEach(ticket => {
                    const card = document.createElement('div');
                    card.className = 'ticket-card';
                    card.innerHTML = `
                        <h3>${ticket.pelicula_titulo}</h3>
                        <div class="ticket-info">
                            <p>Sala: <strong>${ticket.sala_nombre}</strong></p>
                            <p>Hora: <strong>${ticket.hora_inicio.slice(0, 5)}</strong></p>
                            <p>Asientos: <strong style="color: #e50914;">${ticket.asientos}</strong></p>
                            <p>Referencia: <strong>${ticket.referencia}</strong></p>
                        </div>
                        <p style="font-size: 0.8rem; color: #4CAF50; font-weight: bold; margin-bottom: 5px;">Muestra este código en la entrada</p>
                        <img class="qr-img" src="${ticket.qr_url}" alt="Código QR de la entrada">
                    `;
                    contenedor.appendChild(card);
                });

            } catch (err) {
                console.error("Error al obtener compras:", err);
                contenedor.innerHTML = '<div class="no-tickets" style="grid-column: 1 / -1;">Error al cargar tus entradas. Inténtalo más tarde.</div>';
            }
        });
    </script>
</body>
</html>
