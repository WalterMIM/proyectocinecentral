<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineCentral - Seleccionar Función</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #141414;
            color: white;
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 30px auto;
        }
        .pelicula-header {
            display: flex;
            gap: 30px;
            background: #1c1c1c;
            padding: 25px;
            border-radius: 10px;
            border: 1px solid #333;
            align-items: center;
        }
        .pelicula-header img {
            width: 180px;
            height: 260px;
            object-fit: cover;
            border-radius: 8px;
        }
        .pelicula-info h1 {
            margin-top: 0;
            color: #e50914;
        }
        .pelicula-info p {
            color: #ccc;
            line-height: 1.5;
        }
        .funciones-seccion {
            margin-top: 40px;
        }
        .funciones-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        .tarjeta-funcion {
            background: #252525;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #3d3d3d;
            text-align: center;
            transition: transform 0.2s, border-color 0.2s;
        }
        .tarjeta-funcion:hover {
            transform: translateY(-4px);
            border-color: #e50914;
        }
        .sala-nombre {
            font-weight: bold;
            color: #aaa;
            font-size: 0.9rem;
            margin-bottom: 8px;
        }
        .hora-inicio {
            font-size: 1.4rem;
            font-weight: 700;
            color: #4CAF50;
            margin-bottom: 15px;
        }
        .btn-seleccionar {
            display: inline-block;
            background: #e50914;
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 0.9rem;
        }
        .btn-seleccionar:hover {
            background: #b80710;
        }
        .no-funciones {
            background: #1c1c1c;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/cartelera" style="color: #aaa; text-decoration: none;">← Volver a Cartelera</a>
        
        <div class="pelicula-header" style="margin-top: 15px;">
            <img id="peli-portada" src="" alt="Portada">
            <div class="pelicula-info">
                <h1 id="peli-titulo">Cargando...</h1>
                <p id="peli-duracion" style="color: #e50914; font-weight: bold;"></p>
                <p id="peli-sinopsis"></p>
            </div>
        </div>

        <div class="funciones-seccion">
            <h2>Horarios y Salas Disponibles</h2>
            <div id="contenedor-funciones" class="funciones-grid">
                <!-- Se cargan dinámicamente -->
            </div>
        </div>
    </div>

    <script>
        const peliculaId = window.location.pathname.split('/').pop();

        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const res = await fetch(`/api/pelicula/${peliculaId}/funciones`);
                if (!res.ok) throw new Error('No se pudo cargar la información');
                
                const data = await res.json();

                // Cargar datos de la película
                document.getElementById('peli-titulo').textContent = data.pelicula.titulo;
                document.getElementById('peli-duracion').textContent = `⏱️ Duración: ${data.pelicula.duracion || 120} min`;
                document.getElementById('peli-sinopsis').textContent = data.pelicula.sinopsis || 'Sin descripción disponible.';
                document.getElementById('peli-portada').src = data.pelicula.portada || '/img/default.jpg';

                // Renderizar funciones
                const contenedor = document.getElementById('contenedor-funciones');
                contenedor.innerHTML = '';

                if (data.funciones.length === 0) {
                    contenedor.innerHTML = '<div class="no-funciones">No hay funciones programadas para esta película por el momento.</div>';
                    return;
                }

                data.funciones.forEach(func => {
                    const card = document.createElement('div');
                    card.className = 'tarjeta-funcion';
                    card.innerHTML = `
                        <div class="sala-nombre">🎬 ${func.sala_nombre}</div>
                        <div class="hora-inicio">${func.hora_inicio.slice(0, 5)}</div>
                        <a href="/comprar/${func.id}" class="btn-seleccionar">Elegir Asientos ➔</a>
                    `;
                    contenedor.appendChild(card);
                });

            } catch (err) {
                console.error("Error al obtener funciones:", err);
            }
        });
    </script>
</body>
</html>
