<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Recuperar Contraseña - CineCentral</title>
    <style>
        body { background-color: #141414; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1f1f1f; padding: 30px; border-radius: 10px; width: 350px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        h2 { color: #e50914; text-align: center; margin-bottom: 20px; }
        label { display: block; margin-top: 15px; font-size: 0.9rem; }
        input { width: 100%; padding: 10px; margin-top: 5px; background: #333; border: 1px solid #444; color: white; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; background: #e50914; color: white; border: none; padding: 12px; margin-top: 20px; border-radius: 5px; font-weight: bold; cursor: pointer; }
        button:hover { background: #f6121d; }
        .back { text-align: center; margin-top: 15px; }
        .back a { color: #aaa; text-decoration: none; font-size: 0.85rem; }
        .back a:hover { color: white; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Recuperar Contraseña</h2>
        <form action="/api/recuperar-contrasena" method="POST">
            <label for="email">Correo electrónico registrado:</label>
            <input type="email" id="email" name="email" required placeholder="tucorreo@email.com">

            <label for="nuevaPassword">Nueva Contraseña:</label>
            <input type="password" id="nuevaPassword" name="nuevaPassword" required placeholder="Mínimo 6 caracteres">

            <button type="submit">Actualizar Contraseña</button>
        </form>
        <div class="back">
            <a href="/login">← Volver al Login</a>
        </div>
    </div>

</body>
</html>
